[supervisord]
nodaemon=true          ; 强制 Supervisord 在前台运行（避免 Docker 容器退出）
logfile=/dev/stdout    ; 将 Supervisord 自身的日志输出到 stdout
logfile_maxbytes=0     ; 不限制日志文件大小（避免日志截断）logfile_maxbytes=0
pidfile=/var/run/supervisord.pid
user=root  ; 显式声明以 root 运行


[program:init_settings]
command=python -c "from bisheng.api import settings as ragflowSettings; ragflowSettings.init_settings()"
autorestart=false
priority=100
startsecs=0
stdout_logfile=/dev/stdout

[program:run_workers]
command=/bin/bash /home/ewing/newProject/bisheng/docker/launch_backend_service.sh
autorestart=true
priority=90
depends_on=init_settings
startretries=3
stdout_logfile=/dev/stdout

[program:update_progress]
# command=python -c "from bisheng.api.services.document_service import DocumentService; import time, logging; while True: time.sleep(3); try: DocumentService.update_progress(); except: logging.exception('Error')"
command=python run_update_progress.py
autostart=true
autorestart=true
priority=85
startretries=3
stdout_logfile=/dev/stdout

[program:uvicorn]
command=uvicorn bisheng.main:app --host 0.0.0.0 --port 7860 --no-access-log --workers 1
autostart=true
priority=80
depends_on=run_workers
stdout_logfile=/dev/stdout

[program:celery]
command=celery -A bisheng.worker.main worker -l info -c 4
autostart=true
priority=70
stdout_logfile=/dev/stdout