; supervisord.conf
[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
logfile_maxbytes=50MB
logfile_backups=10

# [program:init]
# command=/app/init.sh
# priority=1
# autostart=true
# autorestart=false
# startretries=1
# stdout_logfile=/dev/stdout
# stdout_logfile_maxbytes=0
# stderr_logfile=/dev/stderr
# stderr_logfile_maxbytes=0

# [program:init_settings]
# command=python -c "from bisheng.api import settings as ragflowSettings; ragflowSettings.init_settings()"
# priority=2  # 确保优先级高于api
# autostart=true
# autorestart=false
# startsecs=0
# stdout_logfile=/dev/stdout
# depends_on=init  # 如果需要等待init完成



[program:worker]
command=/app/launch_backend_service.sh
priority=30
autostart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
# depends_on=init_settings  # 关键依赖

[program:progress]
command=python /app/update_progress.py
priority=40
autostart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
# depends_on=init_settings  # 关键依赖


[program:api]
command=uvicorn bisheng.main:app --host 0.0.0.0 --port 7860 --no-access-log --workers 1
directory=/app
priority=50
autostart=true
# depends_on=init_settings  # 关键依赖
# exitcodes=0
stdout_logfile=/dev/stdout


[program:celery]
command=celery -A bisheng.worker.main worker -l info -c 4
autostart=true
priority=70
stdout_logfile=/dev/stdout